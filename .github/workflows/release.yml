name: Release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: write
  # Доверенная публикация: nuget.org меняет OIDC-токен прогона на короткоживущий ключ.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Полная история и теги обязательны: версию пакетов считает MinVer,
      # а по мелкой копии он выдаст 0.0.0-alpha.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet build -c Release
      - run: dotnet test -c Release
      - run: dotnet pack -c Release -o artifacts/packages
      - run: ls -l artifacts/packages

      # Ключ живёт час и выдаётся в обмен на токен прогона: nuget.org сверяет владельца,
      # репозиторий и имя файла workflow с доверенной политикой. Шаг стоит прямо перед
      # пушем — запрошенный раньше ключ успел бы истечь на долгой сборке.
      - name: Вход в NuGet по OIDC
        id: nuget-login
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        with:
          user: gberikov

      - name: Публикация в NuGet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/packages/*.nupkg
